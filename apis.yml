name: MoveitPro
kind: company
description: MoveitPro (MoveitPro+) is web-based moving company management software
  built by professional movers, covering the full operation of a moving and storage
  company - CRM and lead capture, estimating and quoting, a smart dispatch board with
  drag-and-drop scheduling and crew assignment, fleet and maintenance management,
  digital bills of lading and e-signatures, itemized inventory, storage and warehouse
  tracking, invoicing and credit-card payments, commission tracking, and AI call
  transcription and QA. MoveitPro advertises "Open API & Custom Integrations" and
  ships native integrations (QuickBooks, Twilio, Mailchimp, Google Maps/Calendar),
  but does not publish a self-serve public developer API, reference documentation,
  or OpenAPI. Its only publicly documented programmatic surface is a Zapier
  integration exposing Clients, Leads, Jobs, and Estimates. The APIs listed below
  are logical resources modeled from that documented Zapier integration; MoveitPro
  does not publish HTTP endpoints, base URLs, or authentication details.
